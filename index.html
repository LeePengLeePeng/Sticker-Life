<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>貼紙製造機 · 影像測試</title>
<style>
:root{--bg:#14202b;--ink:#f3f0e8;--sub:#8fa3b3;--acc:#ffd23f;--line:#2a3b4a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans TC",system-ui,sans-serif;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);display:flex;flex-direction:column}
header{padding:14px 18px 6px;position:relative}
#mode{position:absolute;right:14px;top:14px;padding:6px 12px;font-size:13px}
h1{font-size:20px;margin:0;font-weight:800;letter-spacing:.02em}
#status{color:var(--sub);font-size:13px;min-height:20px;margin-top:2px}
main{flex:1;min-height:0;display:flex;flex-direction:column;padding:8px 18px 18px;gap:12px}
.stage{flex:1;min-height:0;border-radius:20px;overflow:hidden;position:relative;background:#0b141c;
  display:flex;align-items:center;justify-content:center}
.stage video,.stage img,.stage canvas{max-width:100%;max-height:100%;display:block}
#cam{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#frame{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:60%;aspect-ratio:1;
  box-shadow:0 0 0 999px rgba(11,20,28,.45);border-radius:22px;pointer-events:none}
.corner{position:absolute;width:44px;height:44px;border:5px solid var(--acc)}
.tl{left:0;top:0;border-right:0;border-bottom:0;border-top-left-radius:22px}
.tr{right:0;top:0;border-left:0;border-bottom:0;border-top-right-radius:22px}
.bl{left:0;bottom:0;border-right:0;border-top:0;border-bottom-left-radius:22px}
.br{right:0;bottom:0;border-left:0;border-top:0;border-bottom-right-radius:22px}
.dot{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;border-radius:50%;
  background:rgba(255,210,63,.85);box-shadow:0 0 0 3px rgba(0,0,0,.3)}
.checker{background:conic-gradient(#1c2b38 25%,#233443 0 50%,#1c2b38 0 75%,#233443 0) 0 0/24px 24px}
#result{filter:none}
#editCanvas{position:absolute;max-width:100%;max-height:100%;display:none;touch-action:none;cursor:crosshair;z-index:4}
#editHint{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:5;display:none;background:rgba(11,20,28,.82);padding:7px 12px;border-radius:999px;color:var(--ink);font-size:13px;white-space:nowrap}
.bar{display:flex;gap:10px;align-items:center}
button,label.btn{font:inherit;font-weight:700;border:0;border-radius:999px;padding:13px 20px;cursor:pointer;
  background:var(--line);color:var(--ink);text-align:center}
button.main{background:var(--acc);color:#1a1a1a;flex:1}
button:disabled{opacity:.4}
button:focus-visible,label.btn:focus-within{outline:3px solid var(--acc);outline-offset:2px}
.shutter{width:72px;height:72px;padding:0;border-radius:50%;background:var(--ink);
  border:5px solid var(--bg);box-shadow:0 0 0 3px var(--ink);margin:0 auto}
.row{display:none;align-items:center;gap:12px;font-size:14px;color:var(--sub)}
.row input{flex:1;accent-color:var(--acc)}
.hide{display:none!important}
#bar{position:absolute;left:0;bottom:0;height:4px;background:var(--acc);width:0;transition:width .2s}
.spin{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(11,20,28,.72);font-weight:700}
#panel{position:fixed;inset:0;z-index:10;display:none;overflow:auto;background:rgba(11,20,28,.95);
  padding:calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 24px)}
#panel .box{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
#panel h2{font-size:22px;margin:0}
#panel p{margin:0;color:var(--sub)}
#panel .pv{width:140px;height:140px;object-fit:contain;margin:0 auto}
.fld{display:flex;flex-direction:column;gap:8px;font-weight:700;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:none;padding:7px 14px;font-weight:600}
.chip.on{background:var(--acc);border-color:var(--acc);color:#1a1a1a}
#panel input[type=text]{font:inherit;color:var(--ink);background:#0b141c;border:2px solid var(--line);
  border-radius:14px;padding:11px 14px;width:100%}
#panel input[type=text]:focus{outline:3px solid var(--acc);outline-offset:1px}
</style>
</head>
<body>
<header>
  <h1>貼紙製造機</h1><button id="mode" type="button" title="切換去背模式"></button>
  <div id="status">準備中…</div>
</header>
<main>
  <div class="stage" id="stage">
    <div id="cam"><video id="video" playsinline muted autoplay></video>
      <div id="frame"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i><i class="dot"></i></div></div>
    <canvas id="result" class="hide"></canvas>

</main>

<div id="panel" role="dialog" aria-modal="true"><div class="box">
  <div id="v1"><div class="box">
    <img class="pv" id="pv1" alt="貼紙預覽">
    <h2>要讓牠活過來嗎？</h2><p>告訴我們牠是誰，牠就會出現在大螢幕上跟大家打招呼。</p>
    <button class="main" id="yes">好，賦予生命</button><button id="no">先不要</button>
  </div></div>
  <div id="v2" class="hide"><div class="box">
    <h2>牠是什麼樣的角色？</h2>
    <div class="fld">名字<input type="text" id="nm" maxlength="12" placeholder="幫牠取個名字"></div>
    <div class="fld">個性（可複選）<div class="chips" id="traits"></div></div>
    <div class="fld">喜歡的事（可複選）<div class="chips" id="hobbies"></div></div>
    <div class="fld">還想補充什麼<input type="text" id="extra" maxlength="40" placeholder="例如：最怕蟑螂"></div>
    <button class="main" id="send">送出，讓牠誕生</button><button id="back">返回</button>
  </div></div>
  <div id="v3" class="hide"><div class="box">
    <h2 id="doneT">牠誕生了！</h2><p id="doneP">看看大螢幕，牠正在路上。</p>
    <button class="main" id="again">再做一個</button>
  </div></div>
</div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { SamModel, AutoProcessor, RawImage, Tensor, env } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.1";

/* ---------- 設定 ---------- */
const FIREBASE_CONFIG = {
  apiKey:"AIzaSyCSYLJJYHMjqrl6KKC8lZE1rlnbcoZ5OPs", authDomain:"drawing-eeecb.firebaseapp.com", projectId:"drawing-eeecb",
  storageBucket:"drawing-eeecb.firebasestorage.app", messagingSenderId:"835181156249", appId:"1:835181156249:web:7d554f5f54d91742c5a508"
};
const MAX_SIDE = 1024;          // 送進模型的照片長邊
const OUT_SIDE = 512;           // 最終貼紙長邊
const MODEL_ID = "Xenova/slimsam-77-uniform";
const MP_WASM = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm";
const MP_LIB = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/vision_bundle.mjs";
const MP_MODEL = "https://storage.googleapis.com/mediapipe-models/interactive_segmenter/magic_touch/float32/1/magic_touch.tflite";
const $ = id => document.getElementById(id);
const setStatus = t => $("status").textContent = t;
const LS = { get:k=>{try{return localStorage.getItem(k)}catch{return null}},
  set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}, del:k=>{try{localStorage.removeItem(k)}catch{}} };
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
let mode = LS.get("segMode");                      // mp＝本機輕量 AI（MediaPipe）；cloud＝雲端去背；ai＝本機 SlimSAM（僅電腦）
if(!["mp","cloud","ai"].includes(mode)) mode = "mp";
if(IS_IOS && mode==="ai") mode = "mp";
let crashed = false;
if(LS.get("segRun")){ crashed = true; LS.del("segRun"); mode = "cloud"; LS.set("segMode","cloud"); }   // 上次剪裁到一半頁面就消失＝當機
const MODE_LABEL = { mp:"模式：本機（輕）", cloud:"模式：雲端 AI", ai:"模式：本機 SAM" };
const paintMode = () => $("mode").textContent = MODE_LABEL[mode] || MODE_LABEL.mp;
addEventListener("error", e => setStatus("錯誤：" + (e.message||e)));
addEventListener("unhandledrejection", e => setStatus("錯誤：" + (e.reason?.message||e.reason)));

/* ---------- 載入 SlimSAM（僅電腦；首次下載，之後走瀏覽器快取） ---------- */
env.allowLocalModels = false;
try{ env.backends.onnx.wasm.numThreads = 1; }catch{}
let model, processor, loading=null;
const SESS = { enableCpuMemArena:false, enableMemPattern:false };   // 推論完就還記憶體
function loadModel(){ if(model&&processor) return Promise.resolve(); return loading ||= _loadModel().finally(()=>{loading=null}); }
async function _loadModel(){
  setStatus("下載分割模型…（第一次較久）");
  const cb = p => { if(p.status==="progress") $("bar").style.width = p.progress+"%"; };
  try{ model = await SamModel.from_pretrained(MODEL_ID,{dtype:"q8",progress_callback:cb,session_options:SESS}); }
  catch(e){ console.warn("q8 失敗，改用預設精度",e); model = await SamModel.from_pretrained(MODEL_ID,{progress_callback:cb,session_options:SESS}); }
  processor = await AutoProcessor.from_pretrained(MODEL_ID);
  $("bar").style.width = "0";
  setStatus("模型就緒，把主體放進框內，按下快門");
}

/* ---------- 載入 MediaPipe 互動式分割（輕量，手機可用；使用函式庫內的 Legacy 版＋keypoint 選取） ---------- */
let mpSeg=null, mpMod=null, mpLoading=null;
function loadMP(){
  if(mpSeg) return Promise.resolve();
  return mpLoading ||= (async()=>{
    setStatus("載入本機 AI…（第一次較久）");
    mpMod = await import(MP_LIB);
    const vision = await mpMod.FilesetResolver.forVisionTasks(MP_WASM);
    const Seg = mpMod.InteractiveSegmenterLegacy || mpMod.InteractiveSegmenter;
    mpSeg = await Seg.createFromOptions(vision,{ baseOptions:{ modelAssetPath:MP_MODEL }, outputConfidenceMasks:true, outputCategoryMask:false });
  })().finally(()=>{ mpLoading=null; });
}
async function mpSegment(){
  let stage="載入模型";
  try{
    await loadMP();
    stage="segment";
    let res=null;
    const ret = mpSeg.segment(photo,{keypoint:{x:.5,y:.5}}, r=>{ res=r; });
    res = res ?? ret;
    if(!res) throw new Error("沒有回傳結果");
    stage="讀取遮罩";
    const arr = res.confidenceMasks ?? res;
    const m = Array.isArray(arr) ? arr[0] : arr;
    const f = m.getAsFloat32Array(); mW=m.width; mH=m.height;
    const u = new Uint8Array(f.length); for(let i=0;i<f.length;i++) u[i]=f[i]>.5?1:0;
    curMask = u;
    try{ (Array.isArray(arr)?arr:[m]).forEach(x=>x.close?.()); res.close?.(); }catch{}
  }catch(e){ throw new Error(`[${stage}] ${e.message||e}`); }
}

/* ---------- 相機 ---------- */
let stream, starting=null, wantCam=true;
function startCam(){
  wantCam = true;
  if(stream?.active){ $("video").play?.().catch(()=>{}); return Promise.resolve(); }
  if(starting) return starting;                       // 已經在要權限／開啟中，不要重複呼叫
  starting = (async()=>{
    try{
      let st;
      try{ st = await navigator.mediaDevices.getUserMedia({
             video:{ facingMode:{ideal:"environment"}, width:{ideal:1280}, height:{ideal:720} }, audio:false }); }
      catch(e){ if(e.name==="NotAllowedError"||e.name==="SecurityError") throw e;
                st = await navigator.mediaDevices.getUserMedia({ video:true, audio:false }); }   // 條件太嚴格時退回最寬鬆設定
      if(!wantCam){ st.getTracks().forEach(t=>t.stop()); return; }   // 等待期間已被要求關閉
      stream = st; $("video").srcObject = st;
      $("video").play?.().catch(()=>{});
    }catch(e){ setStatus("無法開啟相機（"+(e.name||e.message)+"），請改用左下角按鈕選照片"); }
    finally{ starting=null; }
  })();
  return starting;
}
function stopCam(){ wantCam=false; stream?.getTracks().forEach(t=>t.stop()); stream=null; $("video").srcObject=null; }
const camVisible = () => !$("cam").classList.contains("hide");
// 切到系統相機／別的 App 時釋放相機，回來再開，避免相機被佔用或頁面被系統回收
document.addEventListener("visibilitychange", () => {
  if(!document.hidden && camVisible() && stream && !stream.active && !starting && !busy) startCam();   // 只有「原本有串流、被系統中斷」才重開
});

/* ---------- 平滑工具：逐級縮小再放大（近似高斯模糊），再用門檻把邊緣拉圓 ---------- */
const mkC = (w,h)=>{const c=document.createElement("canvas");c.width=Math.max(1,w);c.height=Math.max(1,h);return c;};
function blurBy(src, levels){
  let c = src;
  for(let i=0;i<levels;i++){ const n=mkC(c.width>>1,c.height>>1), x=n.getContext("2d");
    x.imageSmoothingQuality="high"; x.drawImage(c,0,0,n.width,n.height); c=n; }
  for(let i=0;i<levels;i++){ const last=i===levels-1, n=last?mkC(src.width,src.height):mkC(c.width*2,c.height*2), x=n.getContext("2d");
    x.imageSmoothingQuality="high"; x.drawImage(c,0,0,n.width,n.height); c=n; }
  return c;
}
function ramp(c, lo, gain, white){
  const x=c.getContext("2d"), d=x.getImageData(0,0,c.width,c.height);
  for(let i=0;i<d.data.length;i+=4){
    d.data[i+3]=Math.max(0,Math.min(255,(d.data[i+3]-lo)*gain));
    if(white) d.data[i]=d.data[i+1]=d.data[i+2]=255;
  }
  x.putImageData(d,0,0);
}

/* ---------- 貼紙：白邊（圓滑）＋陰影 ---------- */
function makeSticker(cut, border){
  const m = 24, pad = border + m;
  const W = cut.width + pad*2, H = cut.height + pad*2;
  const mk = (w,h)=>{const c=document.createElement("canvas");c.width=w;c.height=h;return c;};

  // 1. 白色剪影
  const sil = mk(W,H), sx = sil.getContext("2d");
  sx.drawImage(cut,pad,pad);
  sx.globalCompositeOperation="source-in"; sx.fillStyle="#fff"; sx.fillRect(0,0,W,H);

  // 2. 膨脹：多層圓周疊加，取樣點數隨半徑增加，避免出現扇形鋸齒
  const dil = mk(W,H), dx = dil.getContext("2d");
  if(border>0){
    for(const r of [border, border*.66, border*.33]){
      const n = Math.max(48, Math.ceil(Math.PI*2*r/1.2));
      for(let i=0;i<n;i++){ const a=i/n*Math.PI*2; dx.drawImage(sil,Math.cos(a)*r,Math.sin(a)*r); }
    }
  }
  dx.drawImage(sil,0,0);

  // 3. 多級模糊 + 門檻化：輪廓變圓滑，邊緣有抗鋸齒
  const big = blurBy(dil, border>=12 ? 3 : 2);
  ramp(big, 100, 4, true);

  // 4. 合成：陰影 + 白邊 + 主體
  const out = mk(W,H), ox = out.getContext("2d");
  ox.shadowColor="rgba(0,0,0,.4)"; ox.shadowBlur=12; ox.shadowOffsetY=4;
  ox.drawImage(big,0,0);
  ox.shadowColor="transparent";
  ox.drawImage(cut,pad,pad);

  // 5. 縮到輸出尺寸
  const s = Math.min(1, OUT_SIDE/Math.max(W,H));
  if(s===1) return out;
  const fin = mk(Math.round(W*s),Math.round(H*s));
  const fx = fin.getContext("2d"); fx.imageSmoothingQuality="high"; fx.drawImage(out,0,0,fin.width,fin.height);
  return fin;
}

/* ---------- 取景框：與畫面上的框同一區域 ---------- */
const FRAME = 0.7;   // 取景框邊長 = 影像短邊的 70%
function sizeFrame(){
  const v=$("video"), sz=Math.round(FRAME*Math.min(v.clientWidth,v.clientHeight));
  if(sz) $("frame").style.width=$("frame").style.height=sz+"px";
}
new ResizeObserver(sizeFrame).observe($("video"));
$("video").addEventListener("loadedmetadata",sizeFrame);
function frameCrop(src,w,h){
  const side=Math.round(FRAME*Math.min(w,h)), sx=(w-side)/2, sy=(h-side)/2, sz=Math.min(side,MAX_SIDE);
  const c=mkC(sz,sz); c.getContext("2d").drawImage(src,sx,sy,side,side,0,0,sz,sz); return c;
}

/* ---------- 自動分割：以取景框中央為選取點 ---------- */
let photo, curMask=null, mW=0, mH=0, cutCanvas=null;
const spin = (on,t) => { $("spin").style.display = on ? "flex":"none"; if(t) $("spinTxt").textContent=t; };
const R = $("result");

async function cloudRemoveBackground(){
  const blob = await new Promise((resolve,reject)=>{
    photo.toBlob(b=>b ? resolve(b) : reject(new Error("無法建立照片資料")), "image/jpeg", 0.82);
  });
  const form = new FormData();
  form.append("image", blob, "camera.jpg");
  const t0 = performance.now();
  const res = await fetch("https://sticker.leepeng20000414.workers.dev/remove-bg", { method:"POST", body:form });
  if(!res.ok){
    let msg = await res.text();
    try{ const j=JSON.parse(msg); msg=j.detail||j.error||msg; }catch{}
    throw new Error(msg || `雲端去背失敗（HTTP ${res.status}）`);
  }
  const blobOut = await res.blob();
  const bmp = await createImageBitmap(blobOut);
  const c = mkC(bmp.width,bmp.height), x=c.getContext("2d");
  x.imageSmoothingQuality="high";
  x.drawImage(bmp,0,0);
  bmp.close?.();
  const sec=((performance.now()-t0)/1000).toFixed(1);
  const model=res.headers.get("X-Model-Used");
  const remaining=res.headers.get("X-RateLimit-Remaining");
  return {canvas:c, sec, model, remaining};
}

/* ---------- 手動修整：直接在透明去背結果上擦除／恢復 ---------- */
let editMode=false, editTool="erase", editHistory=[], editDrawing=false, editLast=null;
const EC=$("editCanvas"), ECTX=EC.getContext("2d");
function syncEditCanvas(){
  if(!cutCanvas) return;
  EC.width=cutCanvas.width; EC.height=cutCanvas.height;
  ECTX.clearRect(0,0,EC.width,EC.height);
  ECTX.drawImage(cutCanvas,0,0);
  const sw=$("stage").clientWidth, sh=$("stage").clientHeight;
  const scale=Math.min(1, sw/cutCanvas.width, sh/cutCanvas.height);
  EC.style.width=Math.max(1,Math.round(cutCanvas.width*scale))+"px";
  EC.style.height=Math.max(1,Math.round(cutCanvas.height*scale))+"px";
}
function pushEditHistory(){
  if(!cutCanvas) return;
  if(editHistory.length>=8) editHistory.shift();
  editHistory.push(ECTX.getImageData(0,0,EC.width,EC.height));
}
function applyEditHistory(){
  const img=editHistory.pop();
  if(!img) return;
  ECTX.putImageData(img,0,0);
  cutCanvas.width=EC.width; cutCanvas.height=EC.height;
  cutCanvas.getContext("2d").drawImage(EC,0,0);
  render();
  syncEditCanvas();
}
function editPoint(ev){
  const r=EC.getBoundingClientRect();
  return {x:(ev.clientX-r.left)*(EC.width/r.width),y:(ev.clientY-r.top)*(EC.height/r.height)};
}
function paintAt(a,b){
  const brush=+$('brush').value;
  ECTX.save();
  ECTX.globalCompositeOperation=editTool==="erase"?"destination-out":"source-over";
  if(editTool==="restore"){
    ECTX.globalCompositeOperation="source-over";
    const dx=b.x-a.x, dy=b.y-a.y;
    const dist=Math.hypot(dx,dy), steps=Math.max(1,Math.ceil(dist/(brush*.35)));
    for(let i=0;i<=steps;i++){
      const t=i/steps, x=a.x+dx*t, y=a.y+dy*t;
      ECTX.save();
      ECTX.beginPath();
      ECTX.arc(x,y,brush/2,0,Math.PI*2);
      ECTX.clip();
      ECTX.drawImage(originalCutSource,0,0);
      ECTX.restore();
    }
    ECTX.restore();
    return;
  }
  ECTX.strokeStyle="#000"; ECTX.lineWidth=brush; ECTX.lineCap="round"; ECTX.lineJoin="round";
  ECTX.beginPath(); ECTX.moveTo(a.x,a.y); ECTX.lineTo(b.x,b.y); ECTX.stroke();
  ECTX.restore();
}
let originalCutSource=null;
function openEditor(){
  if(!cutCanvas) return;
  originalCutSource=mkC(cutCanvas.width,cutCanvas.height);
  originalCutSource.getContext("2d").drawImage(cutCanvas,0,0);
  editHistory=[]; editMode=true; editTool="erase";
  R.classList.add("hide"); EC.style.display="block"; $("editHint").style.display="block";
  $("resBar").classList.add("hide"); $("editBar").classList.remove("hide");
  syncEditCanvas();
  setStatus("手動修整：塗掉多餘的地方");
}
function closeEditor(){
  if(!editMode) return;
  editMode=false;
  cutCanvas=mkC(EC.width,EC.height);
  cutCanvas.getContext("2d").drawImage(EC,0,0);
  EC.style.display="none";
  R.classList.remove("hide"); $("editHint").style.display="none";
  $("editBar").classList.add("hide"); $("resBar").classList.remove("hide");
  render();
  setStatus("修整完成");
}
EC.addEventListener("pointerdown",e=>{ if(!editMode)return; e.preventDefault(); EC.setPointerCapture?.(e.pointerId); pushEditHistory(); editDrawing=true; editLast=editPoint(e); paintAt(editLast,editLast); });
EC.addEventListener("pointermove",e=>{ if(!editDrawing)return; e.preventDefault(); const p=editPoint(e); paintAt(editLast,p); editLast=p; });
EC.addEventListener("pointerup",e=>{ editDrawing=false; editLast=null; });
EC.addEventListener("pointercancel",e=>{ editDrawing=false; editLast=null; });
$("edit").onclick=openEditor;
$("doneEdit").onclick=closeEditor;
$("erase").onclick=()=>{editTool="erase";setStatus("手動修整：擦除模式");};
$("restore").onclick=()=>{editTool="restore";setStatus("手動修整：恢復模式");};
$("undo").onclick=()=>{if(editHistory.length)applyEditHistory();};
$("brush").oninput=()=>$("brushV").textContent=$("brush").value;
window.addEventListener("resize",()=>{if(editMode)syncEditCanvas();});

async function autoSegment(){
  const inputs = await processor(RawImage.fromCanvas(photo));
  const embeds = await model.get_image_embeddings(inputs);
  const rs = inputs.reshaped_input_sizes[0];
  const out = await model({ ...embeds,
    input_points: new Tensor("float32", [.5*rs[1], .5*rs[0]], [1,1,1,2]),
    input_labels: new Tensor("int64", [1n], [1,1,1]) });
  const masks = await processor.post_process_masks(out.pred_masks, inputs.original_sizes, inputs.reshaped_input_sizes);
  const sc = out.iou_scores.data; let best=0;
  for(let i=1;i<3;i++) if(sc[i]>sc[best]) best=i;
  const d = masks[0].dims; mH=d[2]; mW=d[3];
  curMask = masks[0].data.slice(best*mH*mW,(best+1)*mH*mW);   // 複製一份，才能安全釋放原 tensor
  for(const t of [inputs.pixel_values, embeds.image_embeddings, embeds.image_positional_embeddings, out.pred_masks, out.iou_scores, masks[0]])
    try{ t?.dispose?.(); }catch{}
}

/* ---------- 遮罩 → 透明主體（已裁切） ---------- */
function buildCut(){
  const W=photo.width,H=photo.height;
  const m=mkC(mW,mH), mx=m.getContext("2d"), md=mx.createImageData(mW,mH);
  for(let i=0;i<curMask.length;i++) md.data[i*4+3]=curMask[i]?255:0;
  mx.putImageData(md,0,0);
  const sm=blurBy(m,1); ramp(sm,90,3,false);
  const full=mkC(W,H), fx=full.getContext("2d");
  fx.drawImage(photo,0,0); fx.globalCompositeOperation="destination-in";
  fx.imageSmoothingQuality="high"; fx.drawImage(sm,0,0,W,H);
  const id=fx.getImageData(0,0,W,H); let x0=1e9,y0=1e9,x1=-1,y1=-1;
  for(let i=0;i<W*H;i++) if(id.data[i*4+3]>40){const x=i%W,y=(i/W)|0; if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
  if(x1<0) return null;
  const c=mkC(x1-x0+1,y1-y0+1); c.getContext("2d").drawImage(full,x0,y0,c.width,c.height,0,0,c.width,c.height);
  const k=Math.min(1,440/Math.max(c.width,c.height));
  if(k===1) return c;
  const o=mkC(Math.round(c.width*k),Math.round(c.height*k)), ox=o.getContext("2d");
  ox.imageSmoothingQuality="high"; ox.drawImage(c,0,0,o.width,o.height); return o;
}

function render(){
  const b = +$("border").value; $("bv").textContent = b;
  const s = makeSticker(cutCanvas, b);
  R.width=s.width; R.height=s.height; R.getContext("2d").drawImage(s,0,0);
}

/* ---------- 拍攝 → 直接產生貼紙 ---------- */
let busy=false;
async function run(p){
  if(mode==="ai" && !model){ setStatus("本機 SAM 模型還在載入，請稍候"); loadModel().catch(e=>setStatus("模型載入失敗："+(e.message||e))); return; }
  if(busy) return; busy=true;
  photo=p; spin(true, mode==="cloud" ? "雲端 AI 去背中…" : "剪下主體中…");
  $("video").pause?.();
  await new Promise(r=>setTimeout(r,60));
  try{
    const t0=performance.now();
    let note="";
    if(mode==="cloud"){
      const r=await cloudRemoveBackground();
      cutCanvas=r.canvas;
      note=`雲端 AI 完成，用時 ${r.sec} 秒`;
      if(r.model) note += ` · ${r.model}`;
      if(r.remaining) note += ` · 剩餘 ${r.remaining}`;
    }else{
      LS.set("segRun","1");
      if(mode==="ai") await autoSegment(); else await mpSegment();
      LS.del("segRun");
      cutCanvas=buildCut();
      if(!cutCanvas){ setStatus("沒有偵測到主體，請把物體放進框內中央再拍一次"); spin(false); busy=false; startCam(); return; }
      note=`完成，用時 ${((performance.now()-t0)/1000).toFixed(1)} 秒`;
    }
    render();
    $("cam").classList.add("hide"); R.classList.remove("hide"); $("stage").classList.add("checker");
    $("camBar").classList.add("hide"); $("resBar").classList.remove("hide"); $("sliderRow").style.display="flex";
    setStatus(note);
  }catch(e){ LS.del("segRun"); console.error(e); const msg="處理失敗："+(e.message||e); setStatus(msg); alert(msg); startCam(); }
  spin(false); busy=false;
}

$("shoot").onclick = () => { const v=$("video"); if(v.videoWidth) run(frameCrop(v,v.videoWidth,v.videoHeight)); };
$("file").addEventListener("click", () => { if(!IS_IOS) stopCam(); });
$("file").addEventListener("cancel", () => { if(camVisible() && !busy) startCam(); });
async function decodeFile(f){
  try{ return await createImageBitmap(f,{imageOrientation:"from-image"}); }
  catch{ const u=URL.createObjectURL(f), im=new Image(); im.src=u; await im.decode(); URL.revokeObjectURL(u);
    return {width:im.naturalWidth,height:im.naturalHeight,src:im}; }
}
$("file").onchange = async e => {
  const f=e.target.files[0]; if(!f){ if(camVisible()&&!busy) startCam(); return; }
  try{
    const b = await decodeFile(f), src = b.src || b;
    await run(frameCrop(src,b.width,b.height));
  }catch(err){ console.error(err); setStatus("讀取照片失敗："+(err.message||err)); startCam(); }
  e.target.value="";
};
$("border").oninput = () => cutCanvas && render();
$("retake").onclick = () => {
  R.classList.add("hide"); $("cam").classList.remove("hide"); $("stage").classList.remove("checker");
  $("resBar").classList.add("hide"); $("camBar").classList.remove("hide"); $("sliderRow").style.display="none";
  startCam(); setStatus("把主體放進框內，按下快門");
};
$("save").onclick = () => R.toBlob(b => {
  const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download="sticker.png"; a.click();
}, "image/png");

/* ---------- 賦予生命：面板 → 上傳 Firebase ---------- */
const fbApp = initializeApp(FIREBASE_CONFIG);
const db = getFirestore(fbApp);
const OPTS = {
  traits:["害羞","話多","傲嬌","熱血","溫柔","搞怪","愛睏"],
  hobbies:["吃美食","睡覺","唱歌","運動","打電動","看星星","交朋友"] };
for(const k in OPTS) OPTS[k].forEach(t=>{
  const b=document.createElement("button"); b.type="button"; b.className="chip"; b.textContent=t;
  b.setAttribute("aria-pressed","false");
  b.onclick=()=>{ b.classList.toggle("on"); b.setAttribute("aria-pressed",b.classList.contains("on")); };
  $(k).appendChild(b);
});
const picked = id => [...$(id).querySelectorAll(".on")].map(b=>b.textContent);
const view = n => ["v1","v2","v3"].forEach(v=>$(v).classList.toggle("hide",v!=="v"+n));

$("alive").onclick = () => { $("pv1").src=R.toDataURL(); view(1); $("panel").style.display="block"; };
$("no").onclick = () => $("panel").style.display="none";
$("yes").onclick = () => view(2);
$("back").onclick = () => view(1);
$("again").onclick = () => {
  $("panel").style.display="none"; $("nm").value=$("extra").value="";
  document.querySelectorAll(".chip.on").forEach(b=>b.click()); $("retake").click();
};
function stickerDataUrl(){
  let s = 1, url;
  do{
    const c = mkC(Math.round(R.width*s), Math.round(R.height*s));
    c.getContext("2d").drawImage(R,0,0,c.width,c.height);
    url = c.toDataURL("image/webp",0.85);   // 不支援 webp 的瀏覽器會自動退回 png
    s *= 0.8;
  }while(url.length > 700000 && s > 0.2);
  return url;
}
$("send").onclick = async () => {
  const btn=$("send"); btn.disabled=true; btn.textContent="送出中…";
  try{
    const imageUrl = stickerDataUrl();
    const wait = (p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error("寫入逾時，請檢查 Firestore 是否已建立、規則是否允許寫入")),ms))]);
    await wait(addDoc(collection(db,"characters"),{
      name: $("nm").value.trim().slice(0,12) || "無名",
      traits: picked("traits"), hobbies: picked("hobbies"),
      extra: $("extra").value.trim().slice(0,40),
      imageUrl, intro:null, status:"pending", createdAt:serverTimestamp() }),15000);
    view(3);
  }catch(e){ console.error(e); alert("送出失敗："+e.message); }
  btn.disabled=false; btn.textContent="送出，讓牠誕生";
};

/* ---------- 模式切換與啟動 ---------- */
paintMode();
$("mode").onclick = () => {
  if(busy) return;
  const order = IS_IOS ? ["mp","cloud"] : ["mp","cloud","ai"];
  mode = order[(order.indexOf(mode)+1)%order.length]; LS.set("segMode",mode); paintMode();
  if(mode==="cloud") setStatus("已切換為雲端 AI：拍照後送到 Cloudflare Worker 去背");
  else if(mode==="ai") loadModel().catch(e=>setStatus("本機 SAM 載入失敗："+(e.message||e)));
  else loadMP().then(()=>setStatus("本機 AI 就緒，把主體放進框內，按下快門")).catch(e=>setStatus("本機 AI 載入失敗："+(e.message||e)));
};
startCam().then(() => {
  if(crashed) setStatus("上次本機剪裁讓頁面當機，已改用雲端 AI");
  else if(mode==="ai") return loadModel();
  else if(mode==="cloud") setStatus("雲端 AI 已就緒，把主體放進框內，按下快門");
  else return loadMP().then(()=>setStatus("本機 AI 就緒，把主體放進框內，按下快門")).catch(e=>setStatus("本機 AI 載入失敗，可切換雲端："+(e.message||e)));
}).catch(e => setStatus("相機啟動失敗："+(e.message||e)));
</script>

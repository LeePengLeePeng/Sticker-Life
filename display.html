<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>貼紙劇場 · 展示</title>
<style>
:root{--ink:#f3f0e8;--sub:#c9a99a}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#12070a;font:16px/1.5 "Noto Sans TC",system-ui,sans-serif}
#world{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden}
#world>img{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;user-select:none}
#empty{position:fixed;inset:0;z-index:30000;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:20px;pointer-events:none}
.char{position:absolute;left:0;top:0;width:var(--s);height:var(--s);cursor:pointer;transform-origin:50% 100%}
.char img{width:100%;height:100%;object-fit:contain;display:block;animation:bob 2.6s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes bob{50%{translate:0 -7px}}
.nm{position:absolute;left:50%;top:100%;margin-top:2px;transform:translateX(-50%) scale(var(--u,1));transform-origin:50% 0;
  font-size:22px;font-weight:700;color:var(--ink);white-space:nowrap;text-shadow:0 1px 5px #000}
.bubble{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%) scale(var(--u,1));transform-origin:50% 100%;
  width:max-content;max-width:440px;background:var(--ink);color:#1a1a1a;padding:12px 20px;border-radius:26px;font-size:26px;font-weight:500;display:none}
.bubble::after{content:"";position:absolute;left:50%;top:100%;margin-left:-10px;border:10px solid transparent;border-top-color:var(--ink)}
#dark,#glow,#vig{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none}
#dark{z-index:20000}#glow{z-index:20001;mix-blend-mode:screen}
#vig{z-index:20002;background:radial-gradient(ellipse at 50% 55%,transparent 55%,rgba(0,0,12,.45) 100%)}
.lh{position:absolute;z-index:30000;width:40px;height:40px;margin:-20px;border-radius:50%;border:4px solid #fff;background:rgba(255,210,63,.55);cursor:grab;touch-action:none;display:none}
#lj{position:fixed;left:8px;bottom:8px;z-index:30001;font:12px/1.5 monospace;background:rgba(0,0,0,.75);color:#fff;padding:8px 10px;border-radius:8px;display:none;white-space:pre-wrap;user-select:all}
@media (prefers-reduced-motion:reduce){.char img{animation:none}}
</style>
</head>
<body>
<div id="world">
  <img src="assets/00.png" alt="" style="z-index:0">
  <img src="assets/01.png" alt="" style="z-index:1">
  <img src="assets/03.png" alt="" style="z-index:576">   <!-- 麥克風：腳底高度 576，角色腳底比它低就站在它前面 -->
  <img src="assets/02.png" alt="" style="z-index:5000">  <!-- 前景布幔：蓋在所有角色上面 -->
  <canvas id="dark"></canvas><canvas id="glow"></canvas><div id="vig"></div>
</div>
<div id="empty">等待第一個生命誕生…</div><div id="lj"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getFirestore, collection, query, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const app = initializeApp({
  apiKey:"AIzaSyCSYLJJYHMjqrl6KKC8lZE1rlnbcoZ5OPs", authDomain:"drawing-eeecb.firebaseapp.com",
  projectId:"drawing-eeecb", storageBucket:"drawing-eeecb.firebasestorage.app",
  messagingSenderId:"835181156249", appId:"1:835181156249:web:7d554f5f54d91742c5a508" });
const db = getFirestore(app);

/* ---------- 場景座標：全部以 1920×1080 的畫布計算，再整體縮放進視窗 ---------- */
const W=1920, H=1080, S=150;                               // S＝角色基準大小
const $ = id => document.getElementById(id), world=$("world");
let VK=1, VX=0, VY=0;
function fit(){ VK=Math.min(innerWidth/W,innerHeight/H); VX=(innerWidth-W*VK)/2; VY=(innerHeight-H*VK)/2;
  world.style.transform=`translate(${VX}px,${VY}px) scale(${VK})`; }
fit(); addEventListener("resize", fit);
document.documentElement.style.setProperty("--s", S+"px");
const rnd=(a,b)=>a+Math.random()*(b-a), pickOne=a=>a[Math.floor(Math.random()*a.length)];
// 可走區域（座標是「腳底中心」）。舞台台面很薄，所以 y 範圍小；台下是整片地板
const ZONES = { stage:{x0:380,x1:1580,y0:530,y1:590}, floor:{x0:80,x1:1840,y0:860,y1:1035} };
const MIC = { x:969, y:566 };                              // 麥克風後面的站位
const FRONT = { x:969 };                                   // 台前集合點（新角色先在這裡等麥克風）
const GAP=S*.7, DEPTH=1.4, MAX_ON_STAGE=3;
const dist=(a,b)=>Math.hypot(a.x-b.x,(a.y-b.y)*DEPTH);

/* ---------- 自我介紹與隨口說的話 ---------- */
const AI_URL = "https://sticker.leepeng20000414.workers.dev/";
function makeIntro(c){
  const t=c.traits?.length?pickOne(c.traits):"", h=c.hobbies?.length?pickOne(c.hobbies):"";
  return `嗨，我是${c.name}！`+(t?`大家都說我很${t}。`:"")+(h?`我最喜歡${h}。`:"")+(c.extra?c.extra+"。":"")+"請多指教！";
}
async function getIntro(c){
  try{
    const r = await Promise.race([
      fetch(AI_URL,{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({name:c.name,traits:c.traits,hobbies:c.hobbies,extra:c.extra})}),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error("逾時")),8000)) ]);
    const j = await r.json(); if(j.intro) return j.intro;
  }catch(e){ console.warn("AI 失敗，改用句型", e); }
  return makeIntro(c);
}
function makeChatter(c){
  const P=[`我是${c.name}！`,`${c.name}在這裡～`];
  (c.traits||[]).forEach(t=>P.push(`我覺得自己很${t}～`,`${t}就是我！`));
  (c.hobbies||[]).forEach(h=>P.push(`好想${h}～`,`${h}最開心了！`));
  if(c.extra) P.push(c.extra,c.extra+"！",c.extra);
  if(P.length<4) P.push("有人要跟我玩嗎？","今天天氣真好～");
  return P;
}
// pause＝true：角色停下來說（自我介紹）；done：說完之後要做的事
function typeText(c, text, speed=80, hold=5000, pause=false, done=null){
  const box=c.bubble; clearInterval(box._t); clearTimeout(box._h);
  c.talking=true; if(pause) c.speaking=true;
  box.style.display="block"; box.textContent="";
  let i=0; box._t=setInterval(()=>{ box.textContent=text.slice(0,++i); if(i>=text.length) clearInterval(box._t); },speed);
  box._h=setTimeout(()=>{ box.style.display="none"; c.talking=false;
    if(pause){ c.speaking=false; c.idleUntil=performance.now()+1500; } done?.(); }, text.length*speed+hold);
}

/* ---------- 角色狀態：role＝new(進場) → wait(排隊) → up(上台) → speak(講話) → free(自由活動) ---------- */
const chars=new Map(), mic={user:null}, micQueue=[];
function pickTarget(me, zone){                             // 抽 14 個點，挑離別人最遠的
  const Z=ZONES[zone]; let best=null, bd=-1;
  for(let i=0;i<14;i++){
    const p={x:rnd(Z.x0,Z.x1),y:rnd(Z.y0,Z.y1)}; let d=1e9;
    for(const o of chars.values()){ if(o===me) continue;
      if(o.zone===zone||o.tzone===zone) d=Math.min(d,dist(p,o));
      if(o.ty!=null&&o.tzone===zone) d=Math.min(d,dist(p,{x:o.tx,y:o.ty})); }
    if(d>bd){ bd=d; best=p; }
  }
  return best;
}
function goTo(c,x,y,zone){ c.tx=x; c.ty=y; c.tzone=zone; c.jump=zone!==c.zone; c.len=Math.hypot(x-c.x,y-c.y); }
function arrived(c){
  if(c.role==="new") c.role="wait";
  else if(c.role==="up"){ c.role="speak";
    c.introP.then(t=>typeText(c,t,80,5000,true,()=>{ mic.user=null; c.role="free"; const p=pickTarget(c,"floor"); goTo(c,p.x,p.y,"floor"); })); }
}
let last=performance.now();
function tick(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  const list=[...chars.values()], busy=!!mic.user||micQueue.length>0;
  if(!mic.user && micQueue.length){                        // 麥克風空了 → 下一位上台
    const c=micQueue[0]; if(c.role==="wait"&&c.ty==null){ micQueue.shift(); mic.user=c; c.role="up"; goTo(c,MIC.x,MIC.y,"stage"); } }
  if(busy) for(const c of list)                            // 有人要講話：台上的人先下去
    if(c.role==="free" && ((c.zone==="stage"&&c.tzone!=="floor")||c.tzone==="stage")){ const p=pickTarget(c,"floor"); goTo(c,p.x,p.y,"floor"); }
  for(const c of list){                                    // 1. 移動（跨區域時用跳的）
    if(c.speaking) continue;
    if(c.ty!=null){
      const dx=c.tx-c.x, dy=c.ty-c.y, d=Math.hypot(dx,dy);
      if(d<3){ c.x=c.tx; c.y=c.ty; c.zone=c.tzone; c.tx=c.ty=null; c.jump=false; c.idleUntil=now+rnd(2000,6000); arrived(c); }
      else{ const v=Math.min(c.speed*(c.jump?1.5:1)*dt,d); c.x+=dx/d*v; c.y+=dy/d*v; c.ph+=dt*10; if(Math.abs(dx)>2) c.dir=dx<0?-1:1; }
    }else if(c.role==="free" && now>c.idleUntil){          // 沒事做：大多在台下逛，沒人要講話時有機會上台
      const up=!busy && Math.random()<.35 && list.filter(o=>o.zone==="stage"||o.tzone==="stage").length<MAX_ON_STAGE;
      const z=up?"stage":"floor", p=pickTarget(c,z); goTo(c,p.x,p.y,z);
    }
  }
  const ok=c=>c.role==="free"&&c.zone===c.tzone;
  for(let i=0;i<list.length;i++) for(let j=i+1;j<list.length;j++){   // 2. 同一區域內互相推開
    const a=list[i], o=list[j]; if(!ok(a)||!ok(o)||a.zone!==o.zone) continue;
    let dx=o.x-a.x, dy=(o.y-a.y)*DEPTH, d=Math.hypot(dx,dy); if(d>=GAP) continue;
    if(d<.01){ dx=rnd(-1,1); dy=rnd(-1,1); d=Math.hypot(dx,dy)||1; }
    const push=(GAP-d)/2*.35, ux=dx/d*push, uy=dy/d*push/DEPTH; a.x-=ux; a.y-=uy; o.x+=ux; o.y+=uy;
  }
  for(const c of list){                                    // 3. 限制範圍並更新畫面
    if(ok(c)){ const Z=ZONES[c.zone]; c.x=Math.min(Z.x1,Math.max(Z.x0,c.x)); c.y=Math.min(Z.y1,Math.max(Z.y0,c.y)); }
    const sc=Math.min(1.15,Math.max(.78,.8+(c.y-600)/440*.4));        // 越靠近畫面下方越大
    const lift=c.jump&&c.len>0 ? Math.sin(Math.PI*Math.min(1,Math.max(0,1-Math.hypot(c.tx-c.x,c.ty-c.y)/c.len)))*90 : 0;
    const hop=c.ty!=null&&!c.jump ? -Math.abs(Math.sin(c.ph))*10 : 0;
    c.el.style.transform=`translate(${c.x-S/2}px,${c.y-S-lift}px) scale(${sc})`;
    c.el.style.setProperty("--u",(1/sc).toFixed(3));
    c.img.style.transform=`translateY(${hop}px) scaleX(${c.dir})`;
    c.el.style.zIndex=Math.round(c.y)+(c.talking?3000:0);              // 腳底越低越在前；說話的在最前（但仍在前景布幔後面）
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

function addChar(id, d, entrance){
  if(chars.has(id)) return;
  $("empty")?.remove();
  const el=document.createElement("div"); el.className="char";
  el.innerHTML=`<img alt=""><div class="nm"></div><div class="bubble"></div>`;
  const img=el.querySelector("img"); img.src=d.imageUrl; el.style.setProperty("--d",(-Math.random()*2.6).toFixed(2)+"s");
  el.querySelector(".nm").textContent=d.name; world.appendChild(el);
  const c={ el, img, bubble:el.querySelector(".bubble"), x:0, y:0, tx:null, ty:null, zone:"floor", tzone:"floor", jump:false, len:0,
    dir:1, ph:0, speed:rnd(70,100), idleUntil:performance.now()+rnd(200,2500), role:"free", speaking:false, talking:false,
    pool:makeChatter(d), lastLine:"", lastSpoke:Math.random()*1000, born:performance.now(), intro:null };
  if(entrance){                                            // 新角色：從台下左邊走進來，到台前排隊等麥克風
    c.role="new"; c.x=-140; c.y=rnd(880,1000); c.introP=getIntro(d).then(s=>(c.intro=s));
    goTo(c,FRONT.x+rnd(-260,260),rnd(880,950),"floor"); micQueue.push(c);
  }else{ const p=pickTarget(c,"floor"); c.x=p.x; c.y=p.y; }
  el.addEventListener("click", async ()=>{                 // 點角色 → 再說一次自我介紹
    if(c.role!=="free") return;
    if(!c.intro){ c.talking=true; c.bubble.style.display="block"; c.bubble.textContent="…"; c.intro=await getIntro(d); }
    typeText(c,c.intro,80,5000,true);
  });
  chars.set(id,c);
}

/* ---------- 輪流說話：同時說話不超過一半，一個一個錯開 ---------- */
const TALK_RATIO=.5, SPEAK_GAP=[2500,5000]; let nextSpeakAt=0;
const nearTalker=(c,l)=>l.some(o=>o.talking&&o!==c&&Math.abs(o.x-c.x)<S*1.8&&Math.abs(o.y-c.y)<S);
setInterval(()=>{
  const now=performance.now(); if(now<nextSpeakAt) return; const l=[...chars.values()];
  if(l.filter(c=>c.talking).length>=Math.max(1,Math.floor(l.length*TALK_RATIO))) return;
  const ready=l.filter(c=>c.role==="free"&&!c.talking&&now-c.born>4000).sort((a,b)=>a.lastSpoke-b.lastSpoke);
  const c=ready.find(x=>!nearTalker(x,l))||ready[0]; if(!c) return;
  let t,n=0; do{ t=pickOne(c.pool); }while(t===c.lastLine&&c.pool.length>1&&++n<10);
  c.lastLine=t; c.lastSpoke=now; typeText(c,t,60,3500); nextSpeakAt=now+rnd(...SPEAK_GAP);
},700);

/* ---------- 打光：暗部遮罩 + 光源挖洞 + 柔光疊加（座標：x、y 為 0~1，r 為佔畫面寬度的比例）----------
   按 E：編輯光源（拖曳移動、滾輪調大小，左下角顯示數值）；按 L：切換 開燈／關燈 */
const AMBIENT={ rgb:"14,4,10", alpha:.5 };
const LIGHTS=[
  { name:"舞台聚光", x:.495, y:.50, r:.16, squash:.5,  color:"255,226,170", power:1,  flicker:.02 },
  { name:"頂燈",     x:.50,  y:.04, r:.38, squash:.45, color:"255,150,110", power:.6, pulse:.05 },
  { name:"觀眾席",   x:.50,  y:.86, r:.34, squash:.4,  color:"255,200,160", power:.55,pulse:.06 },
];
const dk=$("dark"), gl=$("glow"), dctx=dk.getContext("2d"), gctx=gl.getContext("2d"), Q=.5;
for(const c of [dk,gl]){ c.width=W*Q; c.height=H*Q; }
let day=0, dayTo=0;
const noise=t=>Math.sin(t*7.3)*.5+Math.sin(t*12.9+1.7)*.3+Math.sin(t*3.1)*.2;
const powerOf=(L,t)=>L.power*(1+(L.flicker||0)*noise(t+L.x*10)+(L.pulse||0)*Math.sin(t*1.3+L.x*9));
function blob(ctx,x,y,rx,ry,stops){
  ctx.save(); ctx.translate(x,y); ctx.scale(1,ry/rx);
  const g=ctx.createRadialGradient(0,0,0,0,0,rx);
  stops.forEach(([o,a,c])=>g.addColorStop(o,`rgba(${c},${Math.max(0,Math.min(1,a))})`));
  ctx.fillStyle=g; ctx.fillRect(-rx,-rx,rx*2,rx*2); ctx.restore();
}
function drawLights(now){
  const t=now/1000, cw=dk.width, ch=dk.height; day+=(dayTo-day)*.04; const k=1-day;
  dctx.globalCompositeOperation="source-over"; dctx.clearRect(0,0,cw,ch);
  dctx.fillStyle=`rgba(${AMBIENT.rgb},${AMBIENT.alpha*k})`; dctx.fillRect(0,0,cw,ch);
  dctx.globalCompositeOperation="destination-out"; gctx.clearRect(0,0,cw,ch); gctx.globalCompositeOperation="lighter";
  for(const L of LIGHTS){
    const p=powerOf(L,t)*k, x=L.x*cw, y=L.y*ch, rx=L.r*cw, ry=rx*(L.squash||1);
    blob(dctx,x,y,rx,ry,[[0,p,"0,0,0"],[.45,.7*p,"0,0,0"],[.75,.25*p,"0,0,0"],[1,0,"0,0,0"]]);
    blob(gctx,x,y,rx,ry,[[0,.30*p,L.color],[.5,.12*p,L.color],[1,0,L.color]]);
  }
  for(const c of chars.values()){                          // 說話的角色被聚光燈照亮
    c.spot=(c.spot||0)+((c.talking?1:0)-(c.spot||0))*.12;
    if(c.spot>.02){ const r=S*1.6*Q; blob(dctx,c.x*Q,(c.y-S*.55)*Q,r,r*.9,[[0,.9*c.spot*k,"0,0,0"],[.6,.5*c.spot*k,"0,0,0"],[1,0,"0,0,0"]]); }
  }
  $("vig").style.opacity=k.toFixed(2); requestAnimationFrame(drawLights);
}
requestAnimationFrame(drawLights);
const dump=()=>$("lj").textContent=LIGHTS.map(L=>`${L.name}: x:${L.x}, y:${L.y}, r:${L.r.toFixed(3)}`).join("\n");
const place=()=>LIGHTS.forEach((L,i)=>{ handles[i].style.left=L.x*W+"px"; handles[i].style.top=L.y*H+"px"; });
const handles=LIGHTS.map(L=>{
  const h=document.createElement("div"); h.className="lh"; h.title=L.name; world.appendChild(h);
  h.addEventListener("pointerdown",e=>{ h.setPointerCapture(e.pointerId); h._d=true; });
  h.addEventListener("pointermove",e=>{ if(!h._d) return;
    L.x=+(((e.clientX-VX)/VK)/W).toFixed(3); L.y=+(((e.clientY-VY)/VK)/H).toFixed(3); place(); dump(); });
  h.addEventListener("pointerup",()=>{ h._d=false; });
  h.addEventListener("wheel",e=>{ e.preventDefault(); L.r=Math.max(.04,Math.min(.6,L.r-e.deltaY*.0003)); dump(); },{passive:false});
  return h; });
place(); dump(); let editing=false;
addEventListener("keydown",e=>{
  if(e.key==="e"||e.key==="E"){ editing=!editing; handles.forEach(h=>h.style.display=editing?"block":"none"); $("lj").style.display=editing?"block":"none"; }
  if(e.key==="l"||e.key==="L") dayTo=dayTo?0:1;
});

/* ---------- 即時監聽 ---------- */
let first=true;
onSnapshot(query(collection(db,"characters"),orderBy("createdAt","desc"),limit(30)), snap=>{
  snap.docChanges().forEach(ch=>{ if(ch.type==="added") addChar(ch.doc.id,ch.doc.data(),!first); });
  first=false;
}, e=>{ const m=$("empty"); if(m) m.textContent="讀取失敗："+e.message; });
</script>
</body>
</html>
